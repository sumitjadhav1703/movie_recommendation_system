[theme]
base = "dark"
primaryColor = "#E8B86D"
backgroundColor = "#0E1116"
# Keep secondary close to page bg so Streamlit widgets do not look like dark cards.
secondaryBackgroundColor = "#12151C"
textColor = "#F2F0EA"
font = "sans serif"

[server]
headless = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
